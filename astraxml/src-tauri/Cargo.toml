[package]
name = "astraxml"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "astraxml_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
quick-xml = { version = "0.36", features = ["serialize"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[profile.dev]
# Line-tables-only debug info: enough for backtraces, much faster PDB gen than full DWARF (debug=2).
debug = 1
# Minimal optimization: reduces IR size → shorter codegen + faster link vs opt-level=0.
opt-level = 1
# Maximise parallel codegen units (already default=256 for dev, but explicit keeps it if ever changed).
codegen-units = 256
incremental = true

# Compile all third-party crates (tauri, rusqlite, quick-xml, etc.) fully optimised with no debug
# info. These are cached after the first build, so subsequent incremental rebuilds are much faster
# and the generated code is smaller → shorter link times on every build.
[profile.dev.package."*"]
opt-level = 3
debug = false
codegen-units = 16

# Build scripts (including rusqlite's cc-rs SQLite bundled C compilation) compiled at opt-level=3.
# This speeds up the C-source compilation of bundled SQLite.
[profile.dev.build-override]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

